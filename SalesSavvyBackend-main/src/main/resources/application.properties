
spring.application.name=salessavvy
server.port=${PORT:9090}

# MySQL database
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:mysql://localhost:3306/salessavvy}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=update

# Existing security configuration
spring.security.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=3600000

# CORS - local frontend
spring.web.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN:http://localhost:5174}
spring.web.cors.exposed-headers=*
spring.web.cors.max-age=36000
spring.web.cors.allowed-origins=${CORS_ALLOWED_ORIGIN:http://localhost:5174}
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=Content-Type,Authorization
spring.web.cors.allow-credentials=true

# Logging
logging.level.root=INFO
logging.level.org.springframework.web=INFO

# Razorpay
razorpay.key_id=${RAZORPAY_KEY_ID}
razorpay.key_secret=${RAZORPAY_KEY_SECRET}

# Groq AI
groq.base-url=https://api.groq.com/openai/v1
groq.api-key=${GROQ_API_KEY}
groq.model=openai/gpt-oss-120b
logging.level.com.zaxxer.hikari=DEBUG
